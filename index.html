<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="signup-container">
        <div class="image-section">

        </div>
        <div class="form-section">
            <div id="brand">
                <h1>GearShift</h1>
                <p>For Car Enthusiasts, By Car Enthusiasts </p>
            </div>
            <form action="">
                <div class="form-container">
                    <div class="form-group">
                        <label for="first-name">First Name<span aria-label="required">*</span></label>
                        <input type="text" name="first-name" id="first-name" required />
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name<span aria-label="required">*</span></label>
                        <input type="text" name="last-name" id="last-name" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email<span aria-label="required">*</span></label>
                        <input type="email" name="email" id="email" required />
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone (recommended)</label>
                        <input type="tel" name="phone" id="phone" />
                    </div>
                    <div class="form-group">
                        <label for="password">Password<span aria-label="required">*</span></label>
                        <input type="password" name="password" id="password" required />
                    </div>
                    <div class="form-group">
                        <label for="password-confirm">Confirm Password<span aria-label="required">*</span></label>
                        <input type="password" name="password-confirm" id="password-confirm" required />
                    </div>
                    <button type="submit">Create Account</button>
                </div>
            </form>
            <div id="login-link">
                <p>Already have an Account? <strong><a href="#">Log in</a></strong></p>
            </div>
        </div>
    </div>
</body>

</html>
